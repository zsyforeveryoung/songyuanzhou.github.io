<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gaming — Songyuan Zhou</title>
    <style>
        :root {
            --ink: #26352f;
            --muted: #6a746e;
            --green: #46735d;
            --line: #dce2da;
            --paper: #fafbf7
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 35px
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.8 Georgia, 'Times New Roman', serif
        }

        a {
            color: var(--green);
            text-underline-offset: 5px
        }

        a:hover {
            color: #203f30
        }

        header,
        main,
        footer {
            max-width: 1020px;
            margin: auto;
            padding: 0 42px
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 36px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--line);
            font-family: Arial, sans-serif
        }

        .brand {
            text-decoration: none;
            color: var(--ink);
            font-size: 15px;
            letter-spacing: 2px
        }

        nav {
            display: flex;
            gap: 25px
        }

        nav a {
            font-size: 13px;
            text-decoration: none;
            color: var(--muted)
        }

        nav a:hover,
        nav a:focus {
            color: var(--green);
            text-decoration: underline
        }

        .intro {
            display: grid;
            grid-template-columns: 1fr 215px;
            gap: 65px;
            padding: 72px 0 62px
        }

        .eyebrow,
        .label {
            font: 11px/1.5 Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted)
        }

        h1 {
            font-size: 48px;
            line-height: 1.15;
            font-weight: 400;
            letter-spacing: -1.6px;
            margin: 19px 0 24px
        }

        p {
            margin: 0 0 17px
        }

        .lead {
            font-size: 20px;
            line-height: 1.7
        }

        .intro-links {
            display: flex;
            gap: 24px;
            margin-top: 29px;
            font-size: 14px
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px
        }

        .social-link svg {
            width: 26px;
            height: 26px;
            fill: currentColor
        }

        .portrait {
            background: #edf1e8;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #dce4d6;
            position: relative
        }

        .monogram {
            font-size: 70px;
            color: #9aac98;
            font-style: italic;
            line-height: 1.4
        }

        .portrait small {
            font: 10px Arial, sans-serif;
            letter-spacing: 2px;
            color: #73836d
        }

        .caption {
            font-size: 12px;
            color: var(--muted);
            margin-top: 9px;
            text-align: center;
            font-style: italic
        }

        .section {
            border-top: 1px solid var(--line);
            padding: 40px 0 45px;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px
        }

        h2 {
            font-size: 25px;
            line-height: 1.3;
            font-weight: 400;
            margin: 0 0 12px
        }

        h3 {
            font-size: 21px;
            font-weight: 400;
            margin: 0 0 10px
        }

        .number {
            font: 11px Arial, sans-serif;
            color: #8a9689;
            display: block;
            margin-bottom: 17px
        }

        .sub {
            font-size: 13px;
            color: var(--muted);
            max-width: 160px
        }

        .empty {
            padding: 23px 26px;
            border-left: 2px solid #b9c9b5;
            background: #f0f3eb
        }

        .empty p {
            font-size: 15px;
            margin-bottom: 0;
            color: var(--muted)
        }

        .tag {
            display: inline-block;
            font: 10px Arial, sans-serif;
            letter-spacing: 1.3px;
            color: #65765d;
            border: 1px solid #d0dac9;
            padding: 5px 8px;
            margin-bottom: 14px
        }

        .section-intro {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 24px
        }

        footer {
            border-top: 1px solid var(--line);
            padding-top: 23px;
            padding-bottom: 35px;
            display: flex;
            justify-content: space-between;
            font: 12px/1.8 Arial, sans-serif;
            color: var(--muted)
        }

        .skip {
            position: absolute;
            left: 10px;
            top: -60px
        }

        .skip:focus {
            top: 10px
        }

        a:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 5px
        }

        @media(max-width:700px) {

            header,
            main,
            footer {
                padding-left: 24px;
                padding-right: 24px
            }

            header {
                display: block;
                padding-top: 25px
            }

            nav {
                gap: 18px;
                flex-wrap: wrap;
                margin-top: 18px
            }

            .intro {
                grid-template-columns: 1fr;
                gap: 26px;
                padding: 42px 0
            }

            .portrait-wrap {
                display: none
            }

            h1 {
                font-size: 39px
            }

            .section {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 30px 0
            }

            .sub {
                max-width: none
            }

            .number {
                margin-bottom: 10px
            }

            footer {
                gap: 20px
            }

            .lead {
                font-size: 18px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0
        }

        .news-item {
            display: grid;
            grid-template-columns: 105px 1fr;
            gap: 18px;
            padding: 17px 0;
            border-top: 1px solid var(--line)
        }

        .news-item time {
            font: 12px/1.8 Arial, sans-serif;
            color: var(--muted)
        }

        .news-item p {
            margin: 0
        }

        @media(max-width:450px) {
            .news-item {
                grid-template-columns: 1fr;
                gap: 5px
            }
        }

        .steam-icon {
            width: 1.05em;
            height: 1.05em;
            vertical-align: -.16em;
            margin-left: .3em
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
        <a class="brand" href="index.html">SONGYUAN ZHOU</a>
        <nav aria-label="Main navigation">
            <a href="news.html">News</a>
            <a href="blog.html">Blog</a>
            <a href="cv.html">CV</a>
            <a href="gaming.html" aria-current="page">Gaming</a>
        </nav>
    </header>
    <main id="main">
        <div style="padding: 60px 0; min-height: 55vh;">
            <h1>Gaming</h1>
            <p>Coming soon.</p>
            <a href="index.html">Back to home</a>
        </div>
    </main>
    <footer><span>&copy; 2026 Songyuan Zhou</span><a href="index.html">Home</a></footer>
</body>
</html>
